x-db-connection: &db-connection Host=postgres;Port=5432;Database=tuskdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tuskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tuskdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./Tusk.Api
      target: migrations
    image: tusk-migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", *db-connection]

  api:
    build:
      context: ./Tusk.Api
      target: runtime
    image: tusk-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: *db-connection
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
